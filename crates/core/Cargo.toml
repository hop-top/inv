[package]
name = "hop-top-inv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "inv: domain types, FSM facade, tax engine, render pipeline, command layer"

[dependencies]
# Declared at T-0003 to lock the resolution graph. Actual use lands in
# T-0004 (domain types) through T-0013 (command layer).
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
mti = { workspace = true }
tracing = { workspace = true }
statig = { workspace = true }
tera = { workspace = true }
hop-top-kit = { workspace = true }
hop-top-uri = { workspace = true }
toml = { workspace = true }

# Optional: enable the `schema` feature to derive `schemars::JsonSchema`
# on every public domain type. Off by default — only hop-top-inv-mcp needs it.
schemars = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
tokio = { workspace = true }

[features]
# Default: HTML bytes as a PDF stub. Lets the render pipeline be wired
# end-to-end (commands, blob store, channels) without committing to a
# heavy PDF dep at v1. The "real" engines are stubbed/TODO behind their
# own feature flags and ship at v1.1.
default = ["pdf-stub"]
# Stub: render_pdf returns the HTML bytes verbatim. Useful for tests +
# dev; lets callers exercise the contract without a real engine.
pdf-stub = []
# Pure-Rust: typst-based engine. TODO at v1.1; the dep is currently
# absent and the feature is here only for forward compat.
pdf-typst = []
# System binary: shells out to wkhtmltopdf. TODO at v1.1.
pdf-wkhtmltopdf = []
# Python sidecar: invokes weasyprint via a subprocess. TODO at v1.1.
pdf-weasyprint = []
# JSON Schema derives on every public domain type. Off by default; only
# enabled by consumers that ship typed wire schemas (e.g. hop-top-inv-mcp).
schema = ["dep:schemars"]

[lints]
workspace = true
