[package]
name = "hop-top-inv-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "inv: HTTP API channel adapter (axum)"

[dependencies]
# Async runtime + serde primitives shared with the rest of the workspace.
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }

# HTTP stack.
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# HMAC-SHA256 over signed-link tokens + outbound webhook signatures.
sha2 = { workspace = true }

# Constant-time byte comparison for bearer-token auth (timing-side-channel
# hardening — see crate::auth).
subtle = { workspace = true }

# base64url encoding for the public signed-link token + outbound webhook
# delivery (handled inside the adapter so the hop-top-inv-commands surface stays
# transport-agnostic).
base64 = { workspace = true }
reqwest = { workspace = true }

# inv crates we adapt over.
hop-top-inv-core     = { workspace = true }
hop-top-inv-store    = { workspace = true }
hop-top-inv-commands = { workspace = true }
hop-top-inv-bus      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
tempfile = { workspace = true }
# Enable the sqlite backend on hop-top-inv-store for the integration test pool.
hop-top-inv-store = { workspace = true, features = ["sqlite"] }

[lints]
workspace = true
