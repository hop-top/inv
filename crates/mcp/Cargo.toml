[package]
name = "hop-top-inv-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "inv: MCP server channel adapter"

[dependencies]
# rmcp 1.7 defaults to ["base64", "macros", "server"]; we add
# `transport-io` for stdio + `schemars` (re-export) for #[schemars(JsonSchema)]
# on tool-input structs.
rmcp = { workspace = true, features = ["transport-io", "schemars"] }

# Workspace primitives
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }

# schemars is brought in via rmcp's `schemars` feature (v1.x) AND used
# directly on tool input/output structs. Pin via workspace so the version
# (+ chrono04 feature) matches what `hop-top-inv-core[schema]` derives expect.
schemars = { workspace = true }

# inv internal crates. `hop-top-inv-core[schema]` turns on `JsonSchema` derives on
# every public domain type so we can use them directly in tool inputs
# without local wire-form mirrors.
hop-top-inv-core = { workspace = true, features = ["schema"] }
hop-top-inv-store = { workspace = true }
hop-top-inv-commands = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Enable `client` for the in-process integration test client + `sqlite`
# storage backend for the in-memory CoreCtx fixture. `test-fixtures`
# brings in `connect_for_tests`. Postgres is opted in by CI via
# `--features hop-top-inv-store/postgres`.
rmcp = { workspace = true, features = ["client", "transport-io", "schemars"] }
hop-top-inv-store = { workspace = true, features = ["sqlite", "test-fixtures"] }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
