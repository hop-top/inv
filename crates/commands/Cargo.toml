[package]
name = "hop-top-inv-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "inv: one-command-core layer that every channel adapter (CLI/API/WS/MCP/bus) calls into"

[dependencies]
# Workspace primitives
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

# inv crates: commands sit on top of core (domain + state + render + tax)
# and store (repository structs). This is the seam that breaks the would-be
# hop-top-inv-core ↔ hop-top-inv-store cycle (hop-top-inv-store already depends on hop-top-inv-core for
# domain types), so commands live in their own crate.
hop-top-inv-core = { workspace = true }
hop-top-inv-store = { workspace = true }

# sqlx is consumed indirectly through hop-top-inv-store::Pool; the only direct
# need from this crate is to express "an open transaction" on the same
# AnyPool. Keep the dep narrow.
sqlx = { workspace = true, features = ["any"] }

[dev-dependencies]
tokio = { workspace = true }
# Enable the sqlite backend on hop-top-inv-store for the integration test pool.
hop-top-inv-store = { workspace = true, features = ["sqlite"] }
# Tempdir used as the LocalBlobStore root for the blob-wiring tests.
tempfile = { workspace = true }
# `InMemoryPublisher` for capturing bus emissions in tests (T-0043
# replaces the per-command emitted_events list with synchronous
# publisher calls). Dev-only — production callers wire their own.
hop-top-inv-bus = { workspace = true }

[lints]
workspace = true
