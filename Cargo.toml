[workspace]
resolver = "2"
members = [
    "bin/inv",
    "crates/api",
    "crates/bus",
    "crates/cli",
    "crates/commands",
    "crates/core",
    "crates/e2e",
    "crates/mcp",
    "crates/store",
    "crates/ws",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT"
authors = ["Jad Bitar <me@jadb.io>"]
repository = "https://github.com/hop-top/inv"
homepage = "https://github.com/hop-top/inv"
description = "Invoicing-as-a-service: composer + lifecycle, multi-channel core, event-bus interop with fin"

[workspace.dependencies]

# --- Async runtime + serde -----------------------------------------------
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# JSON Schema derive. Gated behind crate features (see hop-top-inv-core's `schema`
# feature, hop-top-inv-mcp's hard dep). `chrono04` brings JsonSchema impls for
# chrono::DateTime so downstream derives covering timestamp fields compile.
schemars = { version = "1", features = ["chrono04"] }

# --- Error types ---------------------------------------------------------
thiserror = "2"
anyhow = "1"

# --- Time + decimal + IDs ------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
mti = { version = "1.1", features = ["serde", "instrument"] }

# --- Telemetry -----------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Crypto primitives ---------------------------------------------------
# Used by hop-top-inv-store::blob to compute HMAC-SHA256 over signed file:// URLs
# for the local backend. Lightweight; no key-management story shipped at
# v1 — the signing key is passed in by the caller.
sha2 = "0.10"
# Constant-time byte comparison for bearer-token auth (hop-top-inv-api). Already
# pulled in transitively by sha2/rustls/etc.; pinned here so the api crate
# can take a direct dep.
subtle = "2"

# --- Async traits --------------------------------------------------------
# Needed by hop-top-inv-store::blob::BlobStore — native async-fn-in-trait is
# stable but not yet object-safe, and we want `Arc<dyn BlobStore>` at
# the command layer.
async-trait = "0.1"

# --- FSM + templates ------------------------------------------------------
statig = { version = "0.3", features = ["async"] }
tera = "1"

# --- SQL + blob -----------------------------------------------------------
# sqlx enables driver features per consumer crate (storage-* features
# on hop-top-inv-store). Default sqlite; postgres + mysql (tidb) opt-in.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "migrate", "chrono", "rust_decimal"] }

# --- HTTP + WS + MCP -----------------------------------------------------
axum = { version = "0.8", features = ["macros", "tokio", "ws", "tracing"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
rmcp = "1.7"
# Outbound webhook delivery (hop-top-inv-api) + base64url encoding for signed-link
# tokens served by the public-view route. Both sit on the request path so
# we pin narrowly.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Streams/Sinks helpers for the WebSocket adapter (SplitStream + StreamExt
# used by hop-top-inv-ws to fan a single ws::WebSocket out into a reader half and
# a writer half).
futures-util = "0.3"

# --- CLI -----------------------------------------------------------------
clap = { version = "4", features = ["derive", "string"] }

# --- hop-top primitives --------------------------------------------------
hop-top-kit = { version = "0.4.0-experimental.3", features = ["cli"] }
hop-top-uri = "0.2.0-alpha.1"

# --- Workspace-internal crates (path deps) -------------------------------
hop-top-inv-api      = { path = "crates/api" }
hop-top-inv-bus      = { path = "crates/bus" }
hop-top-inv-cli      = { path = "crates/cli" }
hop-top-inv-commands = { path = "crates/commands" }
hop-top-inv-core     = { path = "crates/core" }
hop-top-inv-mcp      = { path = "crates/mcp" }
hop-top-inv-store    = { path = "crates/store" }
hop-top-inv-ws       = { path = "crates/ws" }

# --- Test helpers --------------------------------------------------------
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml", "json"] }
tempfile = "3"

# =========================================================================
# Workspace-level Cargo features
# =========================================================================
# These are *advertised* here; specific crates wire them up. Default to
# the lean sqlite + statig + (TBD) PDF engine combination.
#
# Storage backends:
#   storage-sqlite     (default)  sqlx::sqlite
#   storage-postgres              sqlx::postgres
#   storage-tidb                  sqlx::mysql (tidb speaks MySQL wire)
#
# FSM adapter:
#   fsm-statig         (default)
#
# PDF engine (T-0010 picks the default):
#   pdf-typst                     pure Rust, recommended default
#   pdf-wkhtmltopdf               system binary
#   pdf-weasyprint                Python sidecar

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
