# Release Please — version bump + changelog PRs, driven by Conventional
# Commits and release-please-config.json (release-type = "simple" — the
# `rust` strategy errors on Cargo workspaces with version.workspace = true).
#
# Publishing intent (v1):
#   We intentionally publish to crates.io MANUALLY at v1. The `release-rs`
#   job below is wired but no-ops unless the repo variable
#   `AUTO_PUBLISH_CRATES` is set to "true" (and `CARGO_REGISTRY_TOKEN`
#   secret is populated). Reasons:
#     - Workspace ships 8 library crates + 1 binary; ordering for
#       `cargo publish` across the dep-graph isn't worked out yet.
#     - We want to eyeball the first few releases before automating.
#   Flip to automated publishing by setting both the variable and the
#   secret on the repo; no other change needed here.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      rs_release_created: ${{ steps.release.outputs.release_created }}
      rs_tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  release-rs:
    needs: release-please
    # Skipped unless BOTH the release-please action cut a release AND the
    # repo variable `AUTO_PUBLISH_CRATES` is set to "true". This is the
    # opt-in switch for moving from manual `cargo publish` to automated.
    if: ${{ needs.release-please.outputs.rs_release_created == 'true' && vars.AUTO_PUBLISH_CRATES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

