# CI for hop-top/inv — Cargo workspace (8 library crates + `inv` binary).
#
# Strategy:
#   - lint          : fmt + clippy --all-features --all-targets, warnings as errors
#   - test-sqlite   : `cargo test --workspace` (sqlite is the default backend)
#   - test-postgres : `cargo test` with `--no-default-features --features hop-top-inv-store/postgres` (push-only; PRs skip)
#   - build-release : optimised workspace build; uploads `inv` artifact on push to main
#
# Matrix:
#   - ubuntu-latest only at v1; macOS / Windows in a follow-up.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "bin/**/Cargo.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "bin/**/Cargo.toml"
      - ".github/workflows/ci.yml"

# Cancel in-progress runs for the same branch / PR when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-sqlite:
    name: Test (sqlite, default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (sqlite, default)
        run: cargo test --workspace

  test-postgres:
    name: Test (postgres)
    # Postgres backend tests run on push to main only — keeps PR feedback
    # under the SQLite job's runtime. Promote to PR coverage once we have
    # a real Postgres service in CI.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (postgres)
        run: cargo test --workspace --no-default-features --features hop-top-inv-store/postgres

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [lint, test-sqlite]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release --all-features
        run: cargo build --release --workspace --all-features

      - name: Upload inv binary
        # Artifact upload only on push to main — PRs don't need binaries.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: inv-${{ runner.os }}-${{ github.sha }}
          path: target/release/inv
          if-no-files-found: error
          retention-days: 14
