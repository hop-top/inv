# CI for hop-top/inv — Cargo workspace (8 library crates + `inv` binary).
#
# Strategy:
#   - lint          : fmt + clippy --all-features --all-targets, warnings as errors
#   - test-sqlite   : `cargo test` against default `inv-store/sqlite` backend
#   - test-postgres : `cargo test` against `inv-store/postgres` (push-only; PRs skip)
#   - build-release : optimised workspace build; uploads `inv` artifact on push to main
#
# Skipped tests:
#   - `signed_link_view_tampered_404` (inv-api) is flaky (~3% failure rate)
#     due to a token-tampering bug in the test itself. Tracked by T-0034.
#     Re-enable in CI when T-0034 lands.
#
# Matrix:
#   - ubuntu-latest only at v1; macOS / Windows in a follow-up.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "bin/**/Cargo.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "bin/**/Cargo.toml"
      - ".github/workflows/ci.yml"

# Cancel in-progress runs for the same branch / PR when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Known-flaky test tracked by T-0034. Centralised here so all test jobs agree.
  SKIP_TESTS: signed_link_view_tampered_404

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-sqlite:
    name: Test (sqlite, default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (inv-store/sqlite)
        # Default features include inv-store/sqlite. Skip the flaky T-0034 test.
        run: cargo test --workspace --features inv-store/sqlite -- --skip ${SKIP_TESTS}

  test-postgres:
    name: Test (postgres)
    # Postgres backend tests run on push to main only — keeps PR feedback
    # under the SQLite job's runtime. Promote to PR coverage once we have
    # a real Postgres service in CI.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (inv-store/postgres)
        run: cargo test --workspace --no-default-features --features inv-store/postgres -- --skip ${SKIP_TESTS}

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [lint, test-sqlite]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release --all-features
        run: cargo build --release --workspace --all-features

      - name: Upload inv binary
        # Artifact upload only on push to main — PRs don't need binaries.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: inv-${{ runner.os }}-${{ github.sha }}
          path: target/release/inv
          if-no-files-found: error
          retention-days: 14
